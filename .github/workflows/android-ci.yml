name: Android CI

on:
  push:
    branches:
      - main
      - research/face-mesh-texture-occlusion
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests and Kotlin compilation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36.1 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run unit tests
        shell: bash
        run: |
          set +e
          gradle --no-daemon testDebugUnitTest
          test_status=$?

          if [ "$test_status" -ne 0 ]; then
            echo "::group::JUnit failure details"
            python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          for report in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              root = ET.parse(report).getroot()
              for case in root.iter("testcase"):
                  failures = [child for child in list(case) if child.tag in ("failure", "error")]
                  for failure in failures:
                      print(f"{case.attrib.get('classname')}::{case.attrib.get('name')}")
                      print(f"Type: {failure.attrib.get('type')}")
                      print(f"Message: {failure.attrib.get('message')}")
                      print(failure.text or "")
          PY
            echo "::endgroup::"
          fi

          exit "$test_status"
